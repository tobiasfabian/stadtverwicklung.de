title: Wissens-Seite

navigation:
  status: all
  template: all

image:
  query: model.teaserImage.toFile
  cover: true

tabs:
  content:
    label: Inhalt
    icon: page
    sections:
      fields:
        fields:
          teaserText:
            label: Teaser-Text
            extends: fields/headline
            help: Wird in der Übersicht angezeigt
            width: 1/2
          teaserImage:
            extends: fields/teaser-image
            width: 1/2
          category:
            label: Kategorie
            type: multiselect
            max: 1
            translate: false
            options:
              type: query
              query: page.parent.categories.toBlocks
              text: "{{ block.headline }}"
              value: "{{ block.id }}"
            help: Neue Kategorien können über die [Übersichts-Seite](pages/wissen?tab=categories) (Wissens-Seite) angelegt werden.
          text:
            extends: fields/blocks
  meta:
    extends: tabs/meta
  pages:
    extends: tabs/subpages
  files:
    extends: tabs/files
