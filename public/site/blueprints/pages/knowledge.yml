title: Veranstaltungen

navigation:
  status: all
  template: all

icon: calendar
image: icon

tabs:
  content:
    label: Inhalt
    icon: page
    sections:
      fields:
        type: fields
        fields:
          alternativeTitle:
            label: Alternativer Titel
            placeholder: "{ model.title }"
            extends: fields/writer-inline
            marks: false
          teaserText:
            label: Teaser-Text
            extends: fields/writer-inline
            width: 1/2
          teaserImage:
            extends: fields/teaser-image
            width: 1/2
      pages:
        label: Unterseiten
        type: pages
        info: "{{ page.category }}"
        templates:
          - knowledge-entry
  categories:
    icon: headline
    label: Kategorien
    sections:
      categories:
        type: fields
        fields:
          categories:
            label: Kategorien
            type: blocks
            translate: false
            help: |
              Hier können Kategorie/Überschriften festgelegt werden. Jede Wissens-Seite (Unterseite) kann einer Kategorie zugeordnet werden.
            fieldsets:
              -
                type: category
                wysiwyg: true
                preview: fields
                icon: headline
                title: Kategorie
                label: "{{ headline }}"
                fields:
                  headline:
                    label: Überschrift
                    extends: fields/writer-inline
                    marks: false
                    width: 1/2
                  headlineEn:
                    label: Überschrift (English)
                    extends: fields/writer-inline
                    marks: false
                    width: 1/2

  meta:
    extends: tabs/meta
  files:
    extends: tabs/files
  analytics:
    extends: tabs/analytics
