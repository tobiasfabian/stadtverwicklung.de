name: Kurzvorstellung
icon: image
wysiwyg: true
preview: fields
fields:
  headline:
    extends: fields/headline
  image:
    extends: fields/image
    width: 2/6
  text:
    extends: fields/writer
    width: 4/6
    required: true
    nodes:
      - paragraph
  ratio:
    extends: fields/ratio
    width: 1/6
  caption:
    label: field.blocks.image.caption
    extends: fields/writer-inline
    width: 5/6
